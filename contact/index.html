<main>
<section class="contact-band">
<div class="wrap contact">
  <div class="contact-intro">
    <h1>CONTACT</h1>
    <p>Contact me here to schedule date availability followed by a meet up consultation to discuss details, packages and more.</p>
    <p><a href="mailto:catherinemariephoto@gmail.com">catherinemariephoto@gmail.com</a></p>
  </div>
  <form id="contact-form" class="contact-form" method="POST" novalidate>
    <fieldset>
      <legend>Name</legend>
      <div class="row">
        <label>First Name <small>(required)</small><input type="text" name="first_name" required autocomplete="given-name"></label>
        <label>Last Name <small>(required)</small><input type="text" name="last_name" required autocomplete="family-name"></label>
      </div>
    </fieldset>
    <label>Email <small>(required)</small><input type="email" name="email" required autocomplete="email"></label>
    <label>Message <small>(required)</small><textarea name="message" rows="5" required></textarea></label>
    <label>Event Date <small>(required)</small><input type="date" name="event_date" required></label>
    <label>Venue/Location <small>(required)</small><input type="text" name="venue" required></label>
    <fieldset class="services">
      <legend>Which service(s) are you looking for? <small>(required)</small></legend>
        <label class="check"><input type="checkbox" name="services" value="Engagement or Save the Date Photos"> Engagement or Save the Date Photos</label>
        <label class="check"><input type="checkbox" name="services" value="Bridal Shower Photos"> Bridal Shower Photos</label>
        <label class="check"><input type="checkbox" name="services" value="Wedding Day Photos"> Wedding Day Photos</label>
        <label class="check"><input type="checkbox" name="services" value="Dance Photos"> Dance Photos</label>
        <label class="check"><input type="checkbox" name="services" value="Family Portraits"> Family Portraits</label>
        <label class="check"><input type="checkbox" name="services" value="Senior Portraits"> Senior Portraits</label>
        <label class="check"><input type="checkbox" name="services" value="Graduation Pictures"> Graduation Pictures</label>
        <label class="check"><input type="checkbox" name="services" value="Event Photography"> Event Photography</label>
        <label class="check"><input type="checkbox" name="services" value="Videography"> Videography</label>
        <label class="check"><input type="checkbox" name="services" value="A Shoot Just for Fun"> A Shoot Just for Fun</label>
        <label class="check"><input type="checkbox" name="services" value="Other"> Other</label>
    </fieldset>
    <label>How did you hear about me? <small>(required)</small><input type="text" name="referral" required></label>
    <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="btn">Send</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>
</div>
</section>
